<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صحت خیری سروس</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Arial', 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height:100vh; direction:rtl; }
.container { max-width:1200px; margin:0 auto; padding:20px; }
.header { background:white; padding:30px; border-radius:10px; margin-bottom:30px; box-shadow:0 5px 15px rgba(0,0,0,0.1); text-align:center; }
.header h1 { color:#333; margin-bottom:10px; font-size:2.5em; }
.header p { color:#666; font-size:1.1em; }
.tabs { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; justify-content:center; }
.tab-btn { padding:12px 30px; background:white; border:none; border-radius:5px; cursor:pointer; font-size:1em; font-weight:bold; color:#667eea; transition:all 0.3s; }
.tab-btn.active { background:#667eea; color:white; }
.tab-content { display:none; background:white; padding:30px; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
.tab-content.active { display:block; }
.form-group { margin-bottom:20px; }
label { display:block; margin-bottom:8px; color:#333; font-weight:bold; }
input, select { width:100%; padding:12px; border:2px solid #ddd; border-radius:5px; font-size:1em; direction:rtl; }
button { background:#667eea; color:white; padding:15px 30px; border:none; border-radius:5px; cursor:pointer; font-size:1.1em; font-weight:bold; width:100%; }
button:hover { background:#764ba2; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media (max-width:768px) { .form-row { grid-template-columns:1fr; } }
.call-box { text-align:center; padding:20px; border:2px dashed #667eea; border-radius:10px; margin-top:20px; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🏥 صحت خیری سروس</h1>
<p>غریب مریضوں کو مفت ڈاکٹری مشورہ</p>
</div>

<div class="tabs">
<button class="tab-btn active" onclick="showTab('doctor-register')">ڈاکٹر رجسٹریشن</button>
<button class="tab-btn" onclick="showTab('patient-register')">مریض رجسٹریشن</button>
<button class="tab-btn" onclick="showTab('doctor-login')">ڈاکٹر لاگ ان</button>
<button class="tab-btn" onclick="showTab('video-call')">ویڈیو کال</button>
<button class="tab-btn" onclick="showTab('dashboard')">ڈیش بورڈ</button>
</div>

<!-- Doctor Registration -->
<div id="doctor-register" class="tab-content active">
<h2>ڈاکٹر رجسٹریشن</h2>
<form onsubmit="registerDoctor(event)">
<div class="form-row">
<div class="form-group"><label>ڈاکٹر کا نام</label><input type="text" id="doc-name" required></div>
<div class="form-group"><label>ای میل</label><input type="email" id="doc-email" required></div>
</div>
<div class="form-row">
<div class="form-group"><label>فون نمبر</label><input type="tel" id="doc-phone" required></div>
<div class="form-group"><label>تخصص</label>
<select id="doc-specialty" required>
<option value="">منتخب کریں</option>
<option value="عام طبیب">عام طبیب</option>
<option value="دل کی بیماری">دل کی بیماری</option>
</select>
</div>
</div>
<div class="form-row">
<div class="form-group"><label>پاس ورڈ</label><input type="password" id="doc-password" required minlength="6"></div>
<div class="form-group"><label>پاس ورڈ دوبارہ</label><input type="password" id="doc-password-confirm" required></div>
</div>
<button type="submit">رجسٹر کریں</button>
</form>
</div>

<!-- Patient Registration -->
<div id="patient-register" class="tab-content">
<h2>مریض رجسٹریشن</h2>
<form onsubmit="registerPatient(event)">
<div class="form-row">
<div class="form-group"><label>مریض کا نام</label><input type="text" id="pat-name" required></div>
<div class="form-group"><label>عمر</label><input type="number" id="pat-age" required></div>
</div>
<div class="form-row">
<div class="form-group"><label>فون نمبر</label><input type="tel" id="pat-phone" required></div>
<div class="form-group"><label>پاس ورڈ</label><input type="password" id="pat-password" required minlength="6"></div>
</div>
<button type="submit">رجسٹر کریں</button>
</form>
</div>

<!-- Doctor Login -->
<div id="doctor-login" class="tab-content">
<h2>ڈاکٹر لاگ ان</h2>
<form onsubmit="loginDoctor(event)">
<div class="form-group"><label>ای میل</label><input type="email" id="login-doc-email" required></div>
<div class="form-group"><label>پاس ورڈ</label><input type="password" id="login-doc-password" required></div>
<button type="submit">لاگ ان کریں</button>
</form>
</div>

<!-- Video Call Section -->
<div id="video-call" class="tab-content">
<h2>ویڈیو کال روم</h2>
<div class="call-box">
    <p style="margin-bottom:15px;">روم کا نام درج کریں اور "کال شروع کریں" پر کلک کریں۔ کال نئے ٹیب میں کھلے گی تاکہ کوئی وقت کی پابندی نہ ہو۔</p>
    <input type="text" id="room-name" value="sehat-khairi-meeting" style="margin-bottom:15px; text-align:center;">
    <button onclick="openVideoCall()" style="background:#28a745;">کال شروع کریں (Start Call)</button>
</div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="tab-content">
<h2>ڈیش بورڈ</h2>
<p>رجسٹرڈ ڈاکٹرز: <span id="doctor-count">0</span></p>
<p>رجسٹرڈ مریض: <span id="patient-count">0</span></p>
</div>
</div>

<script>
let doctors = JSON.parse(localStorage.getItem('doctors')) || [];
let patients = JSON.parse(localStorage.getItem('patients')) || [];

function showTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  if (tab === 'dashboard') updateDashboard();
}

function registerDoctor(e) {
  e.preventDefault();
  const pass = document.getElementById('doc-password').value;
  if (pass !== document.getElementById('doc-password-confirm').value) { alert('پاس ورڈز مماثل نہیں ہیں!'); return; }
  doctors.push({ name: document.getElementById('doc-name').value, email: document.getElementById('doc-email').value, password: pass });
  localStorage.setItem('doctors', JSON.stringify(doctors));
  alert('ڈاکٹر رجسٹر ہو گیا!');
  updateDashboard();
}

function registerPatient(e) {
  e.preventDefault();
  patients.push({ name: document.getElementById('pat-name').value, phone: document.getElementById('pat-phone').value });
  localStorage.setItem('patients', JSON.stringify(patients));
  alert('مریض رجسٹر ہو گیا!');
  updateDashboard();
}

function loginDoctor(e) {
  e.preventDefault();
  const doctor = doctors.find(d => d.email === document.getElementById('login-doc-email').value && d.password === document.getElementById('login-doc-password').value);
  if (doctor) { showTab('video-call'); } else { alert('غلط معلومات'); }
}

// Updated Function: Opens Jitsi in a new tab to avoid the 5-minute limit
function openVideoCall() {
  const roomName = document.getElementById('room-name').value.trim() || 'sehat-khairi-meeting';
  const jitsiUrl = `https://meet.jit.si/${roomName}`;
  window.open(jitsiUrl, '_blank');
}

function updateDashboard() {
  document.getElementById('doctor-count').textContent = doctors.length;
  document.getElementById('patient-count').textContent = patients.length;
}
updateDashboard();
</script>
</body>
</html>
